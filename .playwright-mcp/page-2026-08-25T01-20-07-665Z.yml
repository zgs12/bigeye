                              - text: ：2026 年 8 月 20 日，在 2026 世界机器人大会期间，“CONFLUENCE 群智会”举办，行业关注点从单机智能转向多种机器人协同作业，通用群体人工智能（Collective AGI）概念进入公众视野 。
                            - listitem [ref=f4e671]:
                              - mark [ref=f4e672]:
                                - text: ‌
                                - strong [ref=f4e673]: 中美模型差距缩小
                                - text: ‌
                              - text: ：根据斯坦福 2026 AI 指数报告，截至 2026 年 3 月，美国和中国在 AI 模型性能上的差距已有效缩小，双方在顶级模型表现上交替领先 。
                            - listitem [ref=f4e674]:
