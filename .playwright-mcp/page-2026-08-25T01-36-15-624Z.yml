              - generic [ref=f47e690]:
                - generic "长尾关键词(Long Tail Keyword)是指网站上的非目标关键词但与目标关键词相关的也可以带来搜索流量的组合型关键词。长尾关键词的特征是比较长，往往是2-3个词组成，甚至是短语，存在于内容页面，除了内容页的标题，还存在于内容中。 搜索量非常少，并且不稳定。 长尾关键词带来的客户，转化为网站产品客户的概率比目标关键词高很多，因为长尾词的目的性更强。 存在大量长尾关键词的大中型网站，其带来的总流量非常大。例如，目标关键词是服装，其长尾关键词可以是男士服装、冬装、户外运动装等。长尾关键词基本属性是：可延伸性，针对性强，范围广。长尾关键词是长尾理论在关键词研究上的延伸。“长尾”具有两个特点：细和长。细，说明长尾是份额很少的市场，在以前这是不被重视的市场；长，说明这些市场虽小，但数量众多。众多的微小市场累积起来就会占据市场中可观的份额——这就是长尾的思想。" [ref=f47e692]:
