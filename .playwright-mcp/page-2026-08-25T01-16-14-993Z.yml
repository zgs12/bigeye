                - paragraph [ref=f2e661]:
                  - mark [ref=f2e662]:
                    - text: ‌
                    - strong [ref=f2e663]: “测试”是个很宽泛的词
                    - text: ‌
                    - mark [ref=f2e664]: ，具体意思得看用在什么场景，日常主要指
                    - text: ‌
                    - strong [ref=f2e665]: 检查、测量、试验
                    - text: ‌
                  - text: ，常见于考试、软件检测、心理测评、设备性能验证等。
                - generic [ref=f2e666]:
                  - generic [ref=f2e669]:
                    - generic [ref=f2e670]:
                      - generic [ref=f2e671]:
                        - generic [ref=f2e672]: 这词到底啥意思
                        - text: 
                      - list [ref=f2e683]:
                        - listitem [ref=f2e684]:
                          - mark [ref=f2e685]:
                            - text: ‌
                            - strong [ref=f2e686]: 基本含义
                            - text: ‌
                          - text: ：对事物进行试验性测量或检查，判断是否符合要求、是否存在错误。
                        - listitem [ref=f2e687]:
                          - mark [ref=f2e688]:
                            - text: ‌
                            - strong [ref=f2e689]: 动词用法
                            - text: ‌
                          - text: ：测试某物=检查/测量/试验某物，如“测试网速”“测试软件”。
                        - listitem [ref=f2e690]:
                          - mark [ref=f2e691]:
                            - text: ‌
                            - strong [ref=f2e692]: 名词用法
                            - text: ‌
                          - text: ：指测试活动本身或测试结果，如“通过测试”“测试报告”。
                        - listitem [ref=f2e693]:
                          - mark [ref=f2e694]:
                            - text: ‌
                            - strong [ref=f2e695]: 常见场景
                            - text: ‌
                          - text: ：
                          - list [ref=f2e696]:
                            - listitem [ref=f2e697]:
                              - mark [ref=f2e698]:
                                - text: ‌
                                - strong [ref=f2e699]: 考试测验
                                - text: ‌
                              - text: ：学科测试、驾照考试、IQ测试等。
                            - listitem [ref=f2e700]:
                              - mark [ref=f2e701]:
                                - text: ‌
                                - strong [ref=f2e702]: 软件测试
                                - text: ‌
                              - text: ：验证软件是否满足需求、检测错误。
                            - listitem [ref=f2e703]:
                              - mark [ref=f2e704]:
                                - text: ‌
                                - strong [ref=f2e705]: 设备测试
                                - text: ‌
                              - text: ：电视机出厂测试、压力测试、负载测试。
                            - listitem [ref=f2e706]:
                              - mark [ref=f2e707]:
                                - text: ‌
                                - strong [ref=f2e708]: 心理测试
                                - text: ‌
                              - text: ：人格测试、情绪稳定性测试、职业倾向测试。
                            - listitem [ref=f2e709]:
                              - mark [ref=f2e710]:
                                - text: ‌
                                - strong [ref=f2e711]: 医学测试
                                - text: ‌
                              - text: ：孕检、基因检测、激素检查等。
                            - listitem [ref=f2e712]:
                              - mark [ref=f2e713]:
                                - text: ‌
                                - strong [ref=f2e714]: 推广活动
                                - text: ‌
                              - text: ：免费试用、客户品尝活动有时也叫“测试”。
                    - generic [ref=f2e715]:
                      - generic [ref=f2e716]:
                        - generic [ref=f2e717]: 想测网速怎么弄
                        - text: 
                      - list [ref=f2e728]:
                        - listitem [ref=f2e729]:
                          - mark [ref=f2e730]:
                            - text: ‌
                            - strong [ref=f2e731]: 在线测速
                            - text: ‌
                          - text: ：可搜索“网速在线测量”使用网页测速工具。
                        - listitem [ref=f2e732]:
                          - mark [ref=f2e733]:
                            - text: ‌
                            - strong [ref=f2e734]: 常见指标
                            - text: ‌
                          - text: ：下载速度、上传速度、延迟（ping）、丢包率。
                        - listitem [ref=f2e735]:
                          - mark [ref=f2e736]:
                            - text: ‌
                            - strong [ref=f2e737]: 注意
                            - text: ‌
                          - text: ：测速结果受网络环境、服务器位置、同时使用设备等影响，单次结果仅供参考。
                    - generic [ref=f2e738]:
                      - generic [ref=f2e739]:
                        - generic [ref=f2e740]: 心理测试能信多少
                        - text: 
                      - list [ref=f2e751]:
                        - listitem [ref=f2e752]:
                          - mark [ref=f2e753]:
                            - text: ‌
                            - strong [ref=f2e754]: 可以参考
                            - text: ‌
                          - text: ：心理测试能提供一定心理学参考，帮助了解性格、职业倾向等。
                        - listitem [ref=f2e755]:
                          - mark [ref=f2e756]:
                            - text: ‌
                            - strong [ref=f2e757]: 不能当结论
                            - text: ‌
                            - mark [ref=f2e758]: ：心理测试结果
                            - text: ‌
                            - strong [ref=f2e759]: 不能当成终生标签
                            - text: ‌
                          - text: ，只能反映测试当时的状态。
                        - listitem [ref=f2e760]:
                          - mark [ref=f2e761]:
                            - text: ‌
                            - strong [ref=f2e762]: 常见类型
                            - text: ‌
                          - text: ：
                          - list [ref=f2e763]:
                            - listitem [ref=f2e764]: 人格测验（如16personalities人格测试）。
                            - listitem [ref=f2e765]: 能力测验（智力测验、特殊能力测验）。
                            - listitem [ref=f2e766]: 职业咨询测验。
                            - listitem [ref=f2e767]: 情绪稳定性自测。
                        - listitem [ref=f2e768]:
                          - mark [ref=f2e769]:
                            - text: ‌
                            - strong [ref=f2e770]: 注意事项
                            - text: ‌
                          - text: ：
                          - list [ref=f2e771]:
                            - listitem [ref=f2e772]: 测试常模标准会随时代变化。
                            - listitem [ref=f2e773]: 当事人测试时的心态会影响结果。
                            - listitem [ref=f2e774]: 测试题本身是否有暗示性也会影响结果。
                            - listitem [ref=f2e775]: 最好由专业人士解读结果。
