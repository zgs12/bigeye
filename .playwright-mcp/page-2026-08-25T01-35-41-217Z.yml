                - paragraph [ref=f44e698]:
                  - mark [ref=f44e699]:
                    - text: ‌
                    - strong [ref=f44e700]: “测试”是个很宽泛的词
                    - text: ‌
                    - mark [ref=f44e701]: ，具体意思得看用在什么场景，日常主要指
                    - text: ‌
                    - strong [ref=f44e702]: 检查、测量、试验
                    - text: ‌
                  - text: ，常见于考试、软件检测、心理测评、设备性能验证等。
                - generic [ref=f44e703]:
                  - generic [ref=f44e706]:
                    - generic [ref=f44e707]:
                      - generic [ref=f44e708]:
                        - generic [ref=f44e709]: 这词到底啥意思
                        - text: 
                      - list [ref=f44e720]:
                        - listitem [ref=f44e721]:
                          - mark [ref=f44e722]:
                            - text: ‌
                            - strong [ref=f44e723]: 基本含义
                            - text: ‌
                          - text: ：对事物进行试验性测量或检查，判断是否符合要求、是否存在错误。
                        - listitem [ref=f44e724]:
                          - mark [ref=f44e725]:
                            - text: ‌
                            - strong [ref=f44e726]: 动词用法
                            - text: ‌
                          - text: ：测试某物=检查/测量/试验某物，如“测试网速”“测试软件”。
                        - listitem [ref=f44e727]:
                          - mark [ref=f44e728]:
                            - text: ‌
                            - strong [ref=f44e729]: 名词用法
                            - text: ‌
                          - text: ：指测试活动本身或测试结果，如“通过测试”“测试报告”。
                        - listitem [ref=f44e730]:
                          - mark [ref=f44e731]:
                            - text: ‌
                            - strong [ref=f44e732]: 常见场景
                            - text: ‌
                          - text: ：
                          - list [ref=f44e733]:
                            - listitem [ref=f44e734]:
                              - mark [ref=f44e735]:
                                - text: ‌
                                - strong [ref=f44e736]: 考试测验
                                - text: ‌
                              - text: ：学科测试、驾照考试、IQ测试等。
                            - listitem [ref=f44e737]:
                              - mark [ref=f44e738]:
                                - text: ‌
                                - strong [ref=f44e739]: 软件测试
                                - text: ‌
                              - text: ：验证软件是否满足需求、检测错误。
                            - listitem [ref=f44e740]:
                              - mark [ref=f44e741]:
                                - text: ‌
                                - strong [ref=f44e742]: 设备测试
                                - text: ‌
                              - text: ：电视机出厂测试、压力测试、负载测试。
                            - listitem [ref=f44e743]:
                              - mark [ref=f44e744]:
                                - text: ‌
                                - strong [ref=f44e745]: 心理测试
                                - text: ‌
                              - text: ：人格测试、情绪稳定性测试、职业倾向测试。
                            - listitem [ref=f44e746]:
                              - mark [ref=f44e747]:
                                - text: ‌
                                - strong [ref=f44e748]: 医学测试
                                - text: ‌
                              - text: ：孕检、基因检测、激素检查等。
                            - listitem [ref=f44e749]:
                              - mark [ref=f44e750]:
                                - text: ‌
                                - strong [ref=f44e751]: 推广活动
                                - text: ‌
                              - text: ：免费试用、客户品尝活动有时也叫“测试”。
                    - generic [ref=f44e752]:
                      - generic [ref=f44e753]:
                        - generic [ref=f44e754]: 想测网速怎么弄
                        - text: 
                      - list [ref=f44e765]:
                        - listitem [ref=f44e766]:
                          - mark [ref=f44e767]:
                            - text: ‌
                            - strong [ref=f44e768]: 在线测速
                            - text: ‌
                          - text: ：可搜索“网速在线测量”使用网页测速工具。
                        - listitem [ref=f44e769]:
                          - mark [ref=f44e770]:
                            - text: ‌
                            - strong [ref=f44e771]: 常见指标
                            - text: ‌
                          - text: ：下载速度、上传速度、延迟（ping）、丢包率。
                        - listitem [ref=f44e772]:
                          - mark [ref=f44e773]:
                            - text: ‌
                            - strong [ref=f44e774]: 注意
                            - text: ‌
                          - text: ：测速结果受网络环境、服务器位置、同时使用设备等影响，单次结果仅供参考。
                    - generic [ref=f44e775]:
                      - generic [ref=f44e776]:
                        - generic [ref=f44e777]: 心理测试能信多少
                        - text: 
                      - list [ref=f44e788]:
                        - listitem [ref=f44e789]:
                          - mark [ref=f44e790]:
                            - text: ‌
                            - strong [ref=f44e791]: 可以参考
                            - text: ‌
                          - text: ：心理测试能提供一定心理学参考，帮助了解性格、职业倾向等。
                        - listitem [ref=f44e792]:
                          - mark [ref=f44e793]:
                            - text: ‌
                            - strong [ref=f44e794]: 不能当结论
                            - text: ‌
                            - mark [ref=f44e795]: ：心理测试结果
                            - text: ‌
                            - strong [ref=f44e796]: 不能当成终生标签
                            - text: ‌
                          - text: ，只能反映测试当时的状态。
                        - listitem [ref=f44e797]:
                          - mark [ref=f44e798]:
                            - text: ‌
                            - strong [ref=f44e799]: 常见类型
                            - text: ‌
                          - text: ：
                          - list [ref=f44e800]:
                            - listitem [ref=f44e801]: 人格测验（如16personalities人格测试）。
                            - listitem [ref=f44e802]: 能力测验（智力测验、特殊能力测验）。
                            - listitem [ref=f44e803]: 职业咨询测验。
                            - listitem [ref=f44e804]: 情绪稳定性自测。
                        - listitem [ref=f44e805]:
                          - mark [ref=f44e806]:
                            - text: ‌
                            - strong [ref=f44e807]: 注意事项
                            - text: ‌
                          - text: ：
                          - list [ref=f44e808]:
                            - listitem [ref=f44e809]: 测试常模标准会随时代变化。
                            - listitem [ref=f44e810]: 当事人测试时的心态会影响结果。
                            - listitem [ref=f44e811]: 测试题本身是否有暗示性也会影响结果。
                            - listitem [ref=f44e812]: 最好由专业人士解读结果。
