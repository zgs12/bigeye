                - generic "人工智能（Artificial Intelligence），是一门普通高等学校本科专业，属于电子信息类专业，基本修业年限为四年，授予工学学士学位，2019年设立。人工智能专业是一个以计算机科学为基础，由计算机、心理学、哲学等多学科交叉融合的交叉专业、新兴专业，研究开发用于模拟延伸和扩展人的智能的理论、方法、技术及应用系统的一门新的技术科学，并生产出新的能以人类智能相似的方式做出反应的智能机器，包括机器人、语言识别、图像识别、自然语言处理和专家系统等。旨在培养扎实掌握人工智能基础理论、基本方法和应用技术，能在中国人工智能科学与技术产业发展中发挥作用的优秀人才。2018年，中国各高校积极筹备申报人工智能专业，建立人工智能学院。2019年3月31日，教育部官网公布《2018年度普通高等学校本科专业备案和审批结果的通知》，人工智能被列人新增审批本科专业名单，全国共有35所高校获首批建设资格，专业代" [ref=f33e579]:
