                        - listitem [ref=f41e476]:
                          - text: 春节日期：2026 年春节是 2 月 17 日（农历正月初一），这天零点之后出生的人才属马。‌‌‌
                          - generic [ref=f41e477]: 
                        - listitem [ref=f41e483]:
                          - text: 五行属性：天干"丙"和地支"午"五行都属火，所以也叫"火马年"或"红马年"。‌‌‌
                          - generic [ref=f41e484]: 
                        - listitem [ref=f41e490]:
